&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

    &lt;div class=&quot;rt-news-panel&quot; id=&quot;rt-panel-world&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;rt-tab-world&quot;&gt;&lt;ol class=&quot;rt-news-list&quot;&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.gukjenews.com/news/articleView.html?idxno=3731969&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;[동정] 조주홍 영덕군수 - 국제뉴스&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;국제뉴스 · 19:40 KST · &lt;a href=&quot;https://www.gukjenews.com/news/articleView.html?idxno=3731969&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;(영덕=국제뉴스) 김충남 기자 = 조주홍 영덕군수는 10월 26일(월) 09:00 군청 제1회의실(2층)에서 열리는 &amp;#x27;2026년 신규 임용장 수여식&amp;#x27;에 참석한다. 이어 14:00 영덕군민회관에서 개최하는 &amp;#x27;영덕읍 노인의 날 효 위문공연&amp;#x27;에 참석하고, 15:00 영덕교육지원청 중회의실에서 개최되는 &amp;#x27;2026년 영덕교육행정협의회&amp;#x27;에 참석할 예정이다.&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.hankyung.com/article/202610253648i&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;&amp;quot;일본·독일도 한국 밑&amp;quot;…반도체 호황에 경상수지 &amp;#x27;세계 2위&amp;#x27; - 한국경제&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;한국경제 · 18:43 KST · &lt;a href=&quot;https://www.hankyung.com/article/202610253648i&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;&amp;quot;누가 뭘 하는지 모르겠다&amp;quot;…정 붙일 곳 잃은 직장인, 결국 [한명현의 오피스로그] 직장인 A씨는 업무 중 막히는 일이 생겨도 동료를 찾지 않는다. 챗GPT 같은 생성형 인공지능(AI)에 물어보는 게 더 빠르고 편해서다. 눈치를 볼 필요도 없고, “이런 것도 모르느냐”는 핀잔을... &amp;quot;2028년치 예약도 끝&amp;quot;…거품론 비웃는 빅테크의 &amp;#x27;큰손 베팅&amp;#x27; [박한신의 테크+] &amp;#x27;저 엄청난 투자금을 언제 회수할 수 있을까?&amp;#x27;빅테크들의 인공지능(AI) 투자 계획을 듣다 보면 자연스레 드는 질문이다. 메타는 지난 21일 3분기 실적을 발표하면서 올해 설비투자(CAPEX) 전망을 ... 웹소설·웹툰 지식재산권(IP) 제작·유통 스튜디오 트윈플러스가 자체 제작한 인공지능(AI) 기반 미드폼 애니메이션 2편을 오는 29일 경기 부천시 삼정동 부천아트벙커B39에서 무료로 상영한다...&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.gukjenews.com/news/articleView.html?idxno=3731878&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;물 마시는 정점식 원내대표 - 국제뉴스&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;국제뉴스 · 14:57 KST · &lt;a href=&quot;https://www.gukjenews.com/news/articleView.html?idxno=3731878&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;본문 확인 불가&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.gukjenews.com/news/articleView.html?idxno=3731859&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;[국제포토] 푸른 가을 &amp;amp; 힐링 가을 - 국제뉴스&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;국제뉴스 · 14:53 KST · &lt;a href=&quot;https://www.gukjenews.com/news/articleView.html?idxno=3731859&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;(인천=국제뉴스) 안희영 기자 = 25일 인천광역시 제물포구 월미도와 영종도를 찾은 시민들이 최저기온 11도 최고기온 23도의 화창한 날씨속에 소통과 나들이 일정을 보내고 있다. 금일 월미공원 일대에는 억새와 단풍이 절정을 이루며 나들이객들을 반겼다.&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.yna.co.kr/view/AKR20261025029900051&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;상어 &amp;#x27;부캉이&amp;#x27; 이틀 연속 부산항 국제여객터미널 인근서 관측 - 연합뉴스&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;연합뉴스 · 14:47 KST · &lt;a href=&quot;https://www.yna.co.kr/view/AKR20261025029900051&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;(부산=연합뉴스) 차근호 기자 = 부산 북항 친수공원 인공수로를 빠져나온 상어 &amp;#x27;부캉이&amp;#x27;가 이틀 연속 부산항 국제여객터미널 인근에서 건강하게 유영하는 모습이 확인됐다. 25일 국립수산과학원에 따르면 이날 현장 모니터링 결과 부캉이는 전날과 같은 부산항 국제여객터미널 인근 해상에서 유영하고 있다. 부캉이가 전날 관측된 곳은 마지막으로 머무르던 북항 친수공원과 2㎞가량 떨어진 지점이다. 인공수로 밖이지만 아직 외해는 아닌 항만 구역으로, 일반인의 접근이 제한되는 곳이다. 부캉이는 외해 유도 작업이 마무리된 뒤 지난 23일 한 달 넘게 머물던 인공수로를 벗어났다. 전문가들은 수심 3ｍ가량의 좁은 인공수로에서 생활하던 부캉이가 활동 반경을 넓히며 새로운 환경에 적응하는 과정으로 보고 있다. 수과원은 부캉이가 수심이 깊은 곳으로 이동한 뒤 항만 벽면을 따라 이동한 것으로 추정하고 있다. 수산과학원 관계자는 &amp;quot;부캉이가 어제와 동일한 위치에서 유영하고 있으며 건강상으로도 이상이 없는 것으로 확인됐다&amp;quot;고 밝혔다.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;rt-news-panel&quot; id=&quot;rt-panel-us&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;rt-tab-us&quot; hidden&gt;&lt;ol class=&quot;rt-news-list&quot;&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.mk.co.kr/news/economy/12184975&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;수능 앞두고 물어볼 문제 … “미국 대공황 다시 올까요” - 매일경제&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;매일경제 · 11:03 KST · &lt;a href=&quot;https://www.mk.co.kr/news/economy/12184975&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;1920년대 후반, 제1차 세계대전 이후 회복된 유럽 농업과의 경쟁으로 미국 농가들은 극심한 농산물 가격 폭락에 시달리고 있었습니다. 1928년 대선 당시 허버트 후버(Herbert Hoover) 대통령 후보와 공화당은 “미국 농민을 외국산 농산물로부터 보호하겠다”라며 농산물 수입 관세 인상을 공약으로 내걸었습니다. 여기에 더해 1929년 10월 뉴욕 증시 폭락과 함께 대공황의 먹구름이 밀려오자, 유타주의 리드 스무트(Reed Smoot) 상원 금융위원장과 오리건주의 윌리스 홀리(Willis Hawley) 하원 세입위원장이 주도한 입법 논의는 걷잡을 수 없이 확산하였습니다.&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.m-i.kr/news/articleView.html?idxno=2009773&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;美국채 손실에 환차손까지... 환헤지에 갈린 ETF 성적 - 매일일보&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;매일일보 · 10:00 KST · &lt;a href=&quot;https://www.m-i.kr/news/articleView.html?idxno=2009773&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;매일일보 = 정수연 기자 | 미국 주식에 투자한 상장지수펀드(ETF)의 석 달 성적이 환헤지 여부에 따라 플러스와 마이너스로 갈렸다. 미국 장기국채 ETF는 채권 가격 하락에 환차손까지 겹치면서 환노출형의 낙폭이 더 컸다. 원화 강세가 이어지면서 같은 해외자산에 투자한 상품도 환율 영향을 줄였는지에 따라 성과가 10%p 가까이 벌어졌다. 25일 한국거래소에 따르면 지난 7월 23일부터 이달 23일까지 &amp;#x27;ACE 미국30년국채액티브&amp;#x27;는 11.47% 하락했다. 종가는 9635원에서 8530원으로 내려갔다. 환헤지형인 &amp;#x27;ACE 미국30년국채액티브(H)&amp;#x27;는 같은 기간 1.92% 하락해 두 상품의 낙폭에 차이가 나타났다. 미국 국채는 신용위험이 낮지만 시장에서 거래되는 가격은 금리에 따라 움직인다. 금리가 오르면 기존에 발행된 채권의 가격은 내려가고, 만기가 긴 채권일수록 가격 변동폭도 커진다. 장기채를 편입한 ETF는 이런 가격 변화가 반영되는 데다 환노출형은 달러 가치 하락의 영향도 받아 낙폭이 확대된 것으로 풀이된다. 미국 대표 주가지수를 추종하는 상품에서는 환헤지 여부에 따라 등락 방향까지 달라졌다.&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.newsis.com/view/NISX20261023_0003838736&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;&amp;quot;美 반도체 상승에 크게 건다&amp;quot;…서학개미, 3배 &amp;#x27;속슬&amp;#x27;에 35억달러 순매수 - 뉴시스&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;뉴시스 · 06:00 KST · &lt;a href=&quot;https://www.newsis.com/view/NISX20261023_0003838736&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;본문 확인 불가&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;rt-news-panel&quot; id=&quot;rt-panel-korea&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;rt-tab-korea&quot; hidden&gt;&lt;ol class=&quot;rt-news-list&quot;&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://kr.investing.com/news/stock-market-news/article-2140260&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;골드만삭스, AI 주식 매도세 속 코스피 목표치 25% 하향 - Investing.com 한국어&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;Investing.com 한국어 · 23:53 KST · &lt;a href=&quot;https://kr.investing.com/news/stock-market-news/article-2140260&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;본문 확인 불가&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://news.ikbc.co.kr/article/view/kbc202610250049&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;골드만삭스, 코스피 목표치 1만2천→9천 하향… &amp;quot;그래도 60% 상승 여력&amp;quot; - KBC광주방송&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;KBC광주방송 · 23:40 KST · &lt;a href=&quot;https://news.ikbc.co.kr/article/view/kbc202610250049&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;본문 확인 불가&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.munhwa.com/article/11626089&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;골드만삭스, 코스피 목표 9000으로 25% 낮췄다 - 문화일보&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;문화일보 · 23:23 KST · &lt;a href=&quot;https://www.munhwa.com/article/11626089&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;미국 투자은행 골드만삭스가 코스피의 향후 12개월 목표지수를 기존 1만2000에서 9000으로 25% 낮췄다. 다만, 최근 주가 급락으로 한국 증시가 지나치게 저평가됐다며 여전히 60% 이상의 상승 여력이 있다고 분석했다. 25일(현지시간) 블룸버그통신에 따르면 티머시 모 등 골드만삭스 전략가들은 보고서에서 코스피가 지난 6월 고점 대비 35% 넘게 하락한 점을 반영해 목표지수를 하향 조정했다고 밝혔다. 골드만삭스는 “시장은 지나치게 부정적인 펀더멘털 전망을 주가에 반영하고 있다”며 “기업의 기초체력을 평가하는 방식에 더 보수적인 가정을 반영했지만 현재 한국 증시는 위험 대비 수익 측면에서 여전히 매력적”이라고 평가했다. 이어 “하향 조정된 목표 지수도 현 수준에서 60% 이상의 상승 여력을 의미한다”고 밝혔다. 골드만삭스는 올해 코스피 목표지수를 잇달아 높여 지난 6월 1만2000까지 상향했다. 그러나 인공지능(AI) 인프라에 투입되는 막대한 투자금과 자금 조달 비용, 수익성에 대한 우려가 커지면서 삼성전자와 SK하이닉스 등 반도체 대형주가 타격을 받았다. 매도세는 다른 업종으로도 번져 코스피 전반의 하락으로 이어졌다. 주가 급락으로 한국 증시의 밸류에이션(기업가치 평가)도 크게 낮아졌다. 블룸버그에 따르면 코스피의 향후 12개월 예상 실적 기준 주가수익비율(PER)은 약 4배로 떨어졌다. 블룸버그가 집계한 세계 18개 주요 증시에서 2006년 이후 나타난 적 없는 낮은 수준이다. 골드만삭스는 현재 반도체 업종의 주가에 내년 이익이 65% 감소할 것이라는 전망까지 반영돼 있다며 시장의 우려가 과도하다고 진단했다. 한편 골드만삭스는 목표지수를 낮추면서도 전력과 산업재, 기업 지배구조 개선 관련 종목 등에 대해서는 긍정적인 전망을 유지했다.&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.joongang.co.kr/article/25472636&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;‘코스피 9000’ 눈높이 낮춘 골드만 “상승 여력 60%” 반전 전망 - 중앙일보&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;중앙일보 · 23:21 KST · &lt;a href=&quot;https://www.joongang.co.kr/article/25472636&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;지난 23일 오전 서울 중구 하나은행 딜링룸 전광판에 장 초반 코스피 지수 등 시황이 표시되고 있다. 이날 코스피는 전장보다 130.60포인트(2.36%) 내린 5403.17, 코스닥은 15.78포인트(2.07%) 내린 748.32로 출발했다. 뉴스1 골드만삭스가 코스피의 향후 12개월 목표지수를 1만2000에서 9000으로 25% 낮췄다. 다만 최근 급락으로 한국 주식이 지나치게 저평가됐다며, 낮춘 목표지수도 현 수준에서 60% 이상의 상승 여력을 뜻한다고 평가했다. 25일(현지시간) 블룸버그통신에 따르면 티머시 모 등 골드만삭스 전략가들은 이날 보고서에서 코스피가 지난 6월 고점 대비 35% 넘게 하락한 상황을 반영해 기업가치 평가에 더 보수적인 기준을 적용했다고 밝혔다. 이들은 “시장은 지나치게 부정적인 펀더멘털 전망을 주가에 반영하고 있다”고 진단했다. 이어 “시장이 기업의 기초체력을 평가하는 방식에 더 보수적인 가정을 반영해 목표지수를 낮췄지만, 현재 한국 증시는 위험 대비 수익 측면에서 여전히 매력적”이라고 설명했다. 골드만삭스는 올해 코스피 목표지수를 여러 차례 올려 지난 6월 1만2000까지 높였다. 이후 글로벌 인공지능(AI) 관련주 매도세가 확산하는 동안에도 이 전망을 유지해 왔다. 삼성전자와 SK하이닉스 등 반도체 기업의 비중이 큰 코스피는 AI 인프라 투자 규모와 자금 조달 비용 증가, 투자 수익성에 대한 우려로 타격을 받았다. 매도 압력은 반도체를 넘어 한국 증시 전반으로 번졌다. 블룸버그는 올해 세계 주요 증시 가운데 가장 뜨거웠던 한국 증시가 급락 이후 가장 저렴한 시장으로 변했다고 평가했다. 코스피의 향후 12개월 예상 이익을 기준으로 한 주가수익비율(PER)은 약 4배까지 떨어졌다. 블룸버그가 집계한 18개 증시에서 2006년 이후 처음 나타난 낮은 수준이다. 골드만삭스는 반도체 업종 주가에 2027년 이익이 65% 감소할 것이라는 전망까지 반영돼 있다며 시장이 지나치게 비관적이라고 분석했다. 메모리 반도체 업종을 제외한 종목들은 코스피의 약 절반을 차지하며, 이들의 선행 PER도 7.6배에 그친다고 설명했다.&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://imnews.imbc.com/news/2026/world/article/6860611_36925.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;골드만, 코스피 목표 1만2천→9천‥&amp;quot;그래도 60% 이상 상승 여력&amp;quot; - MBC 뉴스&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;MBC 뉴스 · 22:24 KST · &lt;a href=&quot;https://imnews.imbc.com/news/2026/world/article/6860611_36925.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;본문 확인 불가&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;rt-news-panel&quot; id=&quot;rt-panel-crypto&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;rt-tab-crypto&quot; hidden&gt;&lt;ol class=&quot;rt-news-list&quot;&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.ngonews.kr/news/articleView.html?idxno=241403&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;참여연대 “청년 핑계로 가상자산 과세 미루지 말라”…내년 시행 촉구 - 한국NGO신문&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;한국NGO신문 · 22:55 KST · &lt;a href=&quot;https://www.ngonews.kr/news/articleView.html?idxno=241403&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;국내 가상자산 시장의 거래 규모가 커지는 가운데 투자소득에 대한 과세를 다시 늦추려는 움직임을 두고 논란이 일고 있다. 청년층의 자산 형성을 지원한다는 취지지만 세금 유예가 실제 청년들에게 얼마나 도움이 되는지부터 따져봐야 한다는 지적이다. 참여연대 조세재정개혁센터는 25일 성명을 내고 가상자산 소득 과세를 추가로 연기하려는 정부 방침을 비판하며 예정대로 2027년 1월부터 과세를 시행해야 한다고 주장했다. 참여연대는 청년 투자자가 많다는 사실만으로 과세 연기가 청년층 전체에 이익이 된다고 단정하기 어렵다고 지적했다. 현행 제도는 가상자산 양도·대여로 발생한 연간 소득에서 250만 원을 공제하고 이를 초과하는 소득에 세금을 부과하는 방식이다. 과세를 미루면 투자수익이 발생한 사람에게 세금 부담을 줄이는 효과가 있지만,수익 규모에 따라 혜택이 달라질 수 있다는 게 단체의 설명이다. 청년층의 경제적 어려움을 해결하려면 일자리와 임금, 주거비 부담 등 근본적인 문제에 대응해야 한다는 주장도 제기했다. 투자소득 과세를 유예하는 정책이 실질적인 자산 형성 대책으로 기능하는지 구체적인 근거가 필요하다는 것. 해외 거래소 이용자의 소득을 파악하기 어렵다는 점도 쟁점이다. 참여연대는 국제적인 정보 교환 체계가 충분히 갖춰지지 않았다는 이유로 국내 가상자산 과세까지 미루는 것은 적절하지 않다고 밝혔다. 미국과 영국, 일본, 독일, 호주 등 주요국이 가상자산 관련 과세를 시행하고 있는 만큼 국내에서도 거래정보 확보와 국제공조, 신고 검증 절차를 강화해 과세 사각지대를 줄여야 한다는 입장이다. 이미 여러 차례 시행 시기를 늦춘 상황에서 제도적 미비를 이유로 추가 연기를 추진하는 것은 정부의 준비 부족을 드러내는 것이라는 비판도 내놨다.&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.onebullex.com/ko-kr/academy/injective-protocol-inj-vs-other-decentralized-exchanges-key-differences&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Injective Protocol: 가스 수수료 없는 거래의 혁신 - OneBullEx&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;OneBullEx · 22:12 KST · &lt;a href=&quot;https://www.onebullex.com/ko-kr/academy/injective-protocol-inj-vs-other-decentralized-exchanges-key-differences&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;2026-10-26 (UTC) 기준, Injective Protocol (INJ)은 수수료 없는 거래 실행과 고급 파생상품 인프라를 찾는 DeFi 트레이더들의 관심을 지속적으로 받고 있습니다. 다만 이번 상승장에서 INJ에 대한 CoinGecko 최신 데이터는 없습니다. 비트코인(Bitcoin)은 최근 고점 부근에서 적당한 24시간 거래량을 기록했으며, 이더리움(Ethereum)은 주요 거래쌍에서 안정적인 유동성을 유지했습니다. Injective의 완전히 탈중앙화된 오더북과 크로스체인 상호운용성은 네트워크 가스비를 부과하고 지원 자산을 제한하는 기존 DEX 모델에 대한 뛰어난 대안으로 자리매김하고 있습니다. 제 결론은 명확합니다: 비용 효율성, 무기한 계약(perpetual contracts), 멀티체인 접근을 우선시하는 트레이더는 Injective를 Uniswap, dYdX, PancakeSwap과 비교 평가해야 합니다. 단일 체인의 단순함이나 토큰 스왑 전용 인터페이스를 선호하는 사람들은 기존 AMM으로 충분할 수 있습니다.&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.coinreaders.com/265113&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;비트코인 8만 달러 선 보합…7만 8,400달러 지지 여부가 관건 - 코인리더스&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;코인리더스 · 22:03 KST · &lt;a href=&quot;https://www.coinreaders.com/265113&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;본문 확인 불가&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.coinreaders.com/265115&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;이더리움 2,330달러 지지선 위태…롱 청산 위험에 2,220달러 추가 하락 경고 - 코인리더스&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;코인리더스 · 22:01 KST · &lt;a href=&quot;https://www.coinreaders.com/265115&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;본문 확인 불가&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;rt-news-item&quot;&gt;&lt;a class=&quot;rt-news-title&quot; href=&quot;https://www.onebullex.com/ko-kr/academy/hyperliquid-vs-other-crypto-coins-how-does-hype-compare&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Hyperliquid는 범용 블록체인이 아닌 탈중앙화 무기한 거래소로 작동합니다 - OneBullEx&lt;/a&gt;&lt;p class=&quot;rt-news-meta&quot;&gt;OneBullEx · 20:31 KST · &lt;a href=&quot;https://www.onebullex.com/ko-kr/academy/hyperliquid-vs-other-crypto-coins-how-does-hype-compare&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;원문 링크&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;rt-news-summary&quot;&gt;2026년 10월 26일(UTC) 기준, Hyperliquid(HYPE)는 Binance와 Coinbase를 포함한 주요 거래소에서 76.79달러에 거래되었으며, 자체 플랫폼에서 24시간 거래량이 17,097,508달러에 달했습니다. 구체적인 24시간 가격 변동은 확인되지 않았지만, 토큰의 유동성 프로필은 Binance의 HYPE/USDT 페어에서 +2% 깊이 기준 501,314달러를 보여주며, 이는 의미 있는 마켓 메이커 존재를 나타냅니다. Bitcoin(BTC) 및 Ethereum(ETH)과 같은 기존 암호화폐 대비 HYPE를 평가하는 트레이더들에게, 이 비교는 근본적으로 다른 가치 제안에 달려 있습니다.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
